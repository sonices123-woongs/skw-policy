<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKT 더블유대리점 스마트 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; }
    .page-view { display: none; }
    .page-view.active { display: block; }
  </style>
</head>
<body class="pb-12">

  <!-- ================= 1. 홈 메인 화면 ================= -->
  <div id="page-home" class="page-view active min-h-screen">
    <header class="bg-red-600 text-white p-6 shadow-md rounded-b-2xl">
      <div class="max-w-md mx-auto text-center">
        <span class="text-xs bg-red-800 px-2.5 py-1 rounded-full font-bold tracking-wide">SKT 더블유대리점</span>
        <h1 class="text-2xl font-extrabold mt-2">업무 포털 시스템</h1>
        <p class="text-xs text-red-100 mt-1">원하시는 메뉴를 선택해 주세요</p>
      </div>
    </header>

    <main class="max-w-md mx-auto p-4 mt-4 space-y-4">
      <div class="grid grid-cols-1 gap-4">
        
        <!-- 오늘의 정책 -->
        <button onclick="showPage('policy')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-left hover:shadow-md transition flex items-center justify-between group">
          <div class="space-y-1">
            <span class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded">실시간 단가</span>
            <h2 class="text-xl font-extrabold text-slate-800 group-hover:text-red-600 transition">오늘의 정책</h2>
            <p class="text-xs text-slate-400">010, MNP, 기변 공시지원금 및 인센티브</p>
          </div>
          <div class="w-14 h-14 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center text-2xl font-bold shrink-0">
            <i class="fas fa-file-invoice-dollar"></i>
          </div>
        </button>

        <!-- 재고 조회 -->
        <button onclick="showPage('inventory')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-left hover:shadow-md transition flex items-center justify-between group">
          <div class="space-y-1">
            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">매장 재고</span>
            <h2 class="text-xl font-extrabold text-slate-800 group-hover:text-blue-600 transition">재고 조회</h2>
            <p class="text-xs text-slate-400">지점/매장별 단말기 실시간 재고 현황</p>
          </div>
          <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl font-bold shrink-0">
            <i class="fas fa-boxes-stacked"></i>
          </div>
        </button>

      </div>
    </main>
  </div>


  <!-- ================= 2. 오늘의 정책 화면 ================= -->
  <div id="page-policy" class="page-view">
    <div class="sticky top-0 z-50 bg-slate-100 shadow-sm">
      <header class="bg-red-600 text-white p-4">
        <div class="max-w-md mx-auto flex justify-between items-center">
          <div class="flex items-center gap-2">
            <button onclick="showPage('home')" class="bg-red-700 hover:bg-red-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
              <i class="fas fa-home"></i> 홈
            </button>
            <div>
              <span class="text-[10px] bg-red-800 px-1.5 py-0.5 rounded font-bold">SKT 더블유대리점</span>
              <h1 class="text-lg font-bold">오늘의 정책</h1>
            </div>
          </div>
          <button onclick="fetchPolicyData()" class="bg-red-700 hover:bg-red-800 text-white p-2 rounded-full text-xs flex items-center gap-1 transition">
            <i class="fas fa-sync-alt" id="syncIcon"></i> 동기화
          </button>
        </div>
      </header>

      <div class="max-w-md mx-auto px-4 pt-3 pb-3">
        <div class="bg-white p-3 rounded-xl shadow-md border border-slate-200 space-y-3">
          <div class="relative">
            <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="searchInput" oninput="renderPolicies()" placeholder="기종명/모델코드 검색 (예: 플립, F761, S24, 942)" class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
          </div>
          
          <div class="flex bg-slate-100 p-1 rounded-lg">
            <button onclick="setType('010')" id="tab-010" class="type-btn active flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-red-600 shadow-sm">010 신규</button>
            <button onclick="setType('MNP')" id="tab-MNP" class="type-btn flex-1 py-1.5 text-xs font-bold rounded-md text-slate-500">MNP 번이</button>
            <button onclick="setType('기변')" id="tab-기변" class="type-btn flex-1 py-1.5 text-xs font-bold rounded-md text-slate-500">기기변경</button>
          </div>
        </div>
      </div>
    </div>

    <main class="max-w-md mx-auto px-4 pt-2 space-y-4">
      <div id="loading" class="text-center py-8 text-slate-500 text-sm">
        <i class="fas fa-spinner fa-spin text-2xl text-red-600 mb-2"></i>
        <p id="loadingMsg">실시간 정책 로딩 중...</p>
      </div>
      <div id="policyList" class="space-y-3"></div>
    </main>
  </div>


  <!-- ================= 3. 재고 조회 화면 ================= -->
  <div id="page-inventory" class="page-view min-h-screen">
    <div class="sticky top-0 z-50 bg-slate-100 shadow-sm">
      <header class="bg-blue-600 text-white p-4">
        <div class="max-w-md mx-auto flex justify-between items-center">
          <div class="flex items-center gap-2">
            <button onclick="showPage('home')" class="bg-blue-700 hover:bg-blue-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 transition">
              <i class="fas fa-home"></i> 홈
            </button>
            <div>
              <span class="text-[10px] bg-blue-800 px-1.5 py-0.5 rounded font-bold">SKT 더블유대리점</span>
              <h1 class="text-lg font-bold">재고 조회</h1>
            </div>
          </div>
          <button onclick="fetchInventoryData(true)" class="bg-blue-700 hover:bg-blue-800 text-white p-2 rounded-full text-xs flex items-center gap-1 transition">
            <i class="fas fa-sync-alt" id="invSyncIcon"></i> 새로고침
          </button>
        </div>
      </header>

      <div class="max-w-md mx-auto px-4 pt-3 pb-3 space-y-2">
        <div class="bg-white p-3 rounded-xl shadow-md border border-slate-200 space-y-3">
          <div class="relative">
            <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="invSearchInput" oninput="onInventorySearchChange()" placeholder="기종명/보유처/일련번호 검색 (예: S94, 942, IP18)" class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="grid grid-cols-3 gap-2 text-xs">
            <div>
              <select id="invManagerFilter" onchange="onInventorySearchChange()" class="w-full p-2 border rounded-lg bg-slate-50 text-slate-700 font-semibold focus:outline-none">
                <option value="ALL">담당 전체</option>
              </select>
            </div>
            <div>
              <select id="invCapacityFilter" onchange="onCapacityFilterChange()" class="w-full p-2 border rounded-lg bg-slate-50 text-slate-700 font-semibold focus:outline-none">
                <option value="ALL">용량 전체</option>
              </select>
            </div>
            <div>
              <select id="invColorFilter" onchange="renderInventory()" class="w-full p-2 border rounded-lg bg-slate-50 text-slate-700 font-semibold focus:outline-none">
                <option value="ALL">색상 전체</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main class="max-w-md mx-auto px-4 pt-2 space-y-4">
      <div id="invSummary" class="text-xs text-slate-500 font-bold px-1 flex justify-between items-center">
        <span>조회 결과: <strong id="invCount" class="text-blue-600">0</strong>건 <span id="invLimitMsg" class="text-[10px] text-slate-400 font-normal"></span></span>
        <span id="invTimeInfo" class="text-[10px] text-slate-400 font-normal"></span>
      </div>
      <div id="invLoading" class="text-center py-8 text-slate-500 text-sm hidden">
        <i class="fas fa-spinner fa-spin text-2xl text-blue-600 mb-2"></i>
        <p id="invLoadingText">최신 재고 데이터 불러오는 중...</p>
      </div>
      <div id="inventoryList" class="space-y-3"></div>
    </main>
  </div>


  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw8wPAJ8fYc5tSFgVRV_DGb_G0wIM0IKRLBH-sx0uGVGgvwO8ULaPthgw6BZPsgnKuK0w/exec';
    let allPolicies = [];
    let allInventory = [];
    let currentType = '010';

    function showPage(pageId) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(`page-${pageId}`);
      if (target) {
        target.classList.add('active');
        window.scrollTo(0, 0);
      }
      
      if (pageId === 'policy' && allPolicies.length === 0) {
        fetchPolicyData();
      } else if (pageId === 'inventory') {
        if (allInventory.length === 0) {
          fetchInventoryData(false);
        } else {
          renderInventory();
        }
      }
    }

    // --- 1. 정책 데이터 불러오기 ---
    async function fetchPolicyData() {
      const syncIcon = document.getElementById('syncIcon');
      const loading = document.getElementById('loading');
      
      if (syncIcon) syncIcon.classList.add('fa-spin');
      if (loading) loading.style.display = 'block';

      try {
        const response = await fetch(GAS_URL + '?type=policy', { redirect: 'follow' });
        const data = await response.json();

        if (syncIcon) syncIcon.classList.remove('fa-spin');
        if (loading) loading.style.display = 'none';

        if (data && data.policies && Array.isArray(data.policies)) {
          parseGasRows(data.policies);
          renderPolicies();
        }
      } catch (err) {
        console.error('Policy error:', err);
        if (syncIcon) syncIcon.classList.remove('fa-spin');
        const loadingMsg = document.getElementById('loadingMsg');
        if (loadingMsg) loadingMsg.innerText = '정책 데이터 로딩 실패. 상단 버튼을 눌러주세요.';
      }
    }

    // --- 2. 재고 데이터 초고속 불러오기 ---
    async function fetchInventoryData(forceRefresh) {
      const invSyncIcon = document.getElementById('invSyncIcon');
      const invLoading = document.getElementById('invLoading');
      const invLoadingText = document.getElementById('invLoadingText');
      
      if (invSyncIcon) invSyncIcon.classList.add('fa-spin');
      if (invLoading) invLoading.classList.remove('hidden');
      if (invLoadingText) invLoadingText.innerText = '최신 재고 데이터 불러오는 중...';

      try {
        const response = await fetch(GAS_URL + '?type=inventory', { redirect: 'follow' });
        const data = await response.json();

        if (invSyncIcon) invSyncIcon.classList.remove('fa-spin');
        if (invLoading) invLoading.classList.add('hidden');

        if (data && data.inventory && Array.isArray(data.inventory)) {
          parseInventoryRows(data.inventory);
          populateManagerFilter();
          updateDynamicFilters();
          renderInventory();

          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          document.getElementById('invTimeInfo').innerText = '동기화 완료 (' + nowStr + ')';
        }
      } catch (err) {
        console.error('Inventory error:', err);
        if (invSyncIcon) invSyncIcon.classList.remove('fa-spin');
        if (invLoadingText) invLoadingText.innerText = '동기화 실패. 상단 새로고침을 눌러주세요.';
      }
    }

    // 모델명 문자열에서 용량(128G, 256G, 512G, 1T 등) 추출
    function extractCapacity(modelName) {
      if (!modelName) return '기본용량';
      const upper = modelName.toUpperCase();
      const match = upper.match(/(1TB|1T|512G|256G|128G|64G|512GB|256GB|128GB|64GB)/);
      if (match) {
        let cap = match[0].replace('GB', 'G');
        if (cap === '1TB') cap = '1T';
        return cap;
      }
      return '기본용량';
    }

    function parseInventoryRows(rows) {
      allInventory = [];
      if (!rows || rows.length === 0) return;

      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !Array.isArray(r)) continue;

        let manager = r[0] ? String(r[0]).trim() : '';
        let region = r[1] ? String(r[1]).trim() : '';
        let location = r[2] ? String(r[2]).trim() : '';
        let moveDate = r[3] ? String(r[3]).trim() : '';
        if (moveDate.includes('T')) moveDate = moveDate.split('T')[0];

        let modelName = r[4] ? String(r[4]).trim() : '';
        let color = r[5] ? String(r[5]).trim() : '';
        let serialNo = r[6] ? String(r[6]).trim() : '';

        if (!modelName || modelName === '대표모델명' || modelName === 'None') continue;

        let detectedCap = extractCapacity(modelName);

        allInventory.push({
          manager: manager,
          region: region,
          location: location,
          moveDate: moveDate,
          modelName: modelName,
          capacity: detectedCap,
          color: color,
          serialNo: serialNo
        });
      }

      allInventory.sort((a, b) => {
        if (a.manager !== b.manager) return a.manager.localeCompare(b.manager, 'ko');
        if (a.region !== b.region) return a.region.localeCompare(b.region, 'ko');
        return a.location.localeCompare(b.location, 'ko');
      });
    }

    function populateManagerFilter() {
      const managerSelect = document.getElementById('invManagerFilter');
      if (!managerSelect) return;

      const managers = new Set();
      allInventory.forEach(item => {
        if (item.manager && item.manager !== '레벨2조직명' && item.manager !== '영업담당' && item.manager !== 'None') {
          managers.add(item.manager);
        }
      });

      managerSelect.innerHTML = '<option value="ALL">담당 전체</option>';
      Array.from(managers).sort().forEach(m => {
        managerSelect.innerHTML += `<option value="${m}">${m}</option>`;
      });
    }

    function isMatch(text, query) {
      if (!query) return true;
      if (!text) return false;
      const cleanText = String(text).toLowerCase().replace(/[\s\-_]/g, '');
      const cleanQuery = String(query).toLowerCase().replace(/[\s\-_]/g, '');
      return cleanText.includes(cleanQuery);
    }

    function onInventorySearchChange() {
      updateDynamicFilters();
      renderInventory();
    }

    function onCapacityFilterChange() {
      updateDynamicColorFilter();
      renderInventory();
    }

    // 기종 검색어 및 담당자에 맞춰 용량과 색상 옵션을 실시간 가변 조정
    function updateDynamicFilters() {
      updateDynamicCapacityFilter();
      updateDynamicColorFilter();
    }

    function updateDynamicCapacityFilter() {
      const capSelect = document.getElementById('invCapacityFilter');
      if (!capSelect) return;

      const rawSearch = document.getElementById('invSearchInput').value.trim();
      const managerFilter = document.getElementById('invManagerFilter').value;
      const prevSelectedCap = capSelect.value;

      const availableCaps = new Set();
      allInventory.forEach(item => {
        if (rawSearch && !isMatch(item.modelName, rawSearch) && !isMatch(item.location, rawSearch) && !isMatch(item.serialNo, rawSearch)) return;
        if (managerFilter !== 'ALL' && item.manager !== managerFilter) return;

        if (item.capacity) {
          availableCaps.add(item.capacity);
        }
      });

      capSelect.innerHTML = '<option value="ALL">용량 전체</option>';
      
      // 정렬 순서: 기본용량, 64G, 128G, 256G, 512G, 1T
      const sortOrder = ['기본용량', '64G', '128G', '256G', '512G', '1T'];
      const sortedCaps = Array.from(availableCaps).sort((a, b) => {
        let ia = sortOrder.indexOf(a);
        let ib = sortOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      sortedCaps.forEach(c => {
        const isSelected = (c === prevSelectedCap) ? 'selected' : '';
        capSelect.innerHTML += `<option value="${c}" ${isSelected}>${c}</option>`;
      });

      if (prevSelectedCap !== 'ALL' && !availableCaps.has(prevSelectedCap)) {
        capSelect.value = 'ALL';
      }
    }

    function updateDynamicColorFilter() {
      const colorSelect = document.getElementById('invColorFilter');
      if (!colorSelect) return;

      const rawSearch = document.getElementById('invSearchInput').value.trim();
      const managerFilter = document.getElementById('invManagerFilter').value;
      const capFilter = document.getElementById('invCapacityFilter').value;
      const prevSelectedColor = colorSelect.value;

      const availableColors = new Set();
      allInventory.forEach(item => {
        if (rawSearch && !isMatch(item.modelName, rawSearch) && !isMatch(item.location, rawSearch) && !isMatch(item.serialNo, rawSearch)) return;
        if (managerFilter !== 'ALL' && item.manager !== managerFilter) return;
        if (capFilter !== 'ALL' && item.capacity !== capFilter) return;

        if (item.color && item.color !== '색상' && item.color !== 'None') {
          availableColors.add(item.color);
        }
      });

      colorSelect.innerHTML = '<option value="ALL">색상 전체</option>';
      Array.from(availableColors).sort().forEach(c => {
        const isSelected = (c === prevSelectedColor) ? 'selected' : '';
        colorSelect.innerHTML += `<option value="${c}" ${isSelected}>${c}</option>`;
      });

      if (prevSelectedColor !== 'ALL' && !availableColors.has(prevSelectedColor)) {
        colorSelect.value = 'ALL';
      }
    }

    function renderInventory() {
      const rawSearch = document.getElementById('invSearchInput').value.trim();
      const managerFilter = document.getElementById('invManagerFilter').value;
      const capFilter = document.getElementById('invCapacityFilter').value;
      const colorFilter = document.getElementById('invColorFilter').value;
      const list = document.getElementById('inventoryList');
      if (!list) return;

      const filtered = allInventory.filter(item => {
        if (rawSearch && !isMatch(item.modelName, rawSearch) && !isMatch(item.location, rawSearch) && !isMatch(item.serialNo, rawSearch)) return false;
        if (managerFilter !== 'ALL' && item.manager !== managerFilter) return false;
        if (capFilter !== 'ALL' && item.capacity !== capFilter) return false;
        if (colorFilter !== 'ALL' && item.color !== colorFilter) return false;

        return true;
      });

      document.getElementById('invCount').innerText = filtered.length;
      
      const isFiltered = rawSearch || managerFilter !== 'ALL' || capFilter !== 'ALL' || colorFilter !== 'ALL';
      const displayItems = isFiltered ? filtered : filtered.slice(0, 30);

      const limitMsg = document.getElementById('invLimitMsg');
      if (limitMsg) {
        limitMsg.innerText = (!isFiltered && filtered.length > 30) ? '(상위 30개 표시 중 - 검색 시 전체 조회)' : '';
      }

      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">조회된 재고가 없습니다.</div>`;
        return;
      }

      let htmlBuffer = '';
      displayItems.forEach(item => {
        htmlBuffer += `
          <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded">${item.modelName}</span>
                <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${item.color || '기본색상'}</span>
              </div>
              <div class="text-[11px] text-slate-400 font-mono">
                S/N: <strong class="text-slate-600">${item.serialNo || '-'}</strong>
              </div>
            </div>

            <div class="flex justify-between items-end pt-1 border-t border-slate-100 text-xs text-slate-500">
              <div>
                <div>보유처: <strong class="text-slate-800 font-semibold">${item.location}</strong></div>
                <div class="text-[10px] text-slate-400">입고일: ${item.moveDate || '-'}</div>
              </div>
              <div class="text-right text-[11px] text-slate-400">
                <span>담당: <strong class="text-slate-600 font-medium">${item.manager}</strong></span>
                ${item.region ? `<span class="ml-1">(${item.region})</span>` : ''}
              </div>
            </div>
          </div>
        `;
      });
      list.innerHTML = htmlBuffer;
    }

    function getCategoryData(planCell, commonCell, selectCell, defaultPlan) {
      let plan = defaultPlan;
      if (planCell !== undefined && planCell !== null && String(planCell).trim() !== '' && String(planCell).trim() !== 'None') {
        plan = String(planCell).trim();
      }
      let common = (commonCell !== undefined && commonCell !== null && String(commonCell).trim() !== '' && String(commonCell).trim() !== 'None') 
                   ? String(commonCell).trim() : '0';
      let select = (selectCell !== undefined && selectCell !== null && String(selectCell).trim() !== '' && String(selectCell).trim() !== 'None') 
                   ? String(selectCell).trim() : common;
      return { plan, common, select };
    }

    function parseGasRows(rows) {
      let lastModel = '';
      let lastPlan010 = '베스트109';
      let lastPlanMNP = '베스트109';
      let lastPlanChange = '베스트109';
      allPolicies = [];

      for (let i = 3; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !Array.isArray(r) || r.length < 2) continue;

        let rawPet = r[0] ? String(r[0]).trim() : '';
        if (rawPet && rawPet !== 'None' && rawPet !== '모 델' && rawPet !== '모 델 명') lastModel = rawPet;
        let modelPet = lastModel || '기본모델';

        let modelCode = r[1] ? String(r[1]).trim() : '';
        if (!modelCode || modelCode === '모 델 명' || modelCode === '모델명' || modelCode === 'None' || modelCode === '출고가') continue;

        let price = (r[2] !== undefined && r[2] !== null) ? String(r[2]).replace(/,/g, '') : '0';
        let sub010 = (r[3] !== undefined && r[3] !== null) ? String(r[3]).replace(/,/g, '') : '0';
        let subChange = (r[4] !== undefined && r[4] !== null) ? String(r[4]).replace(/,/g, '') : '0';

        const g010 = getCategoryData(r[5], r[6], r[7], lastPlan010);
        if (g010.plan) lastPlan010 = g010.plan;

        const gMNP = getCategoryData(r[8], r[9], r[10], lastPlanMNP);
        if (gMNP.plan) lastPlanMNP = gMNP.plan;

        const gChange = getCategoryData(r[11], r[12], r[13], lastPlanChange);
        if (gChange.plan) lastPlanChange = gChange.plan;

        let addPolicyVal = (r[14] !== undefined && r[14] !== null) ? String(r[14]).trim() : '';
        let target010MNP = (r[15] !== undefined && r[15] !== null) ? String(r[15]).trim() : '';
        let targetChange = (r[16] !== undefined && r[16] !== null) ? String(r[16]).trim() : '';

        allPolicies.push({
          petName: modelPet, code: modelCode, price: Number(price) || 0,
          sub010: Number(sub010) || 0, subChange: Number(subChange) || 0,
          '010': g010, 'MNP': gMNP, '기변': gChange,
          addPolicyVal: addPolicyVal, target010MNP: target010MNP, targetChange: targetChange
        });
      }
    }

    function renderPolicies() {
      const searchInput = document.getElementById('searchInput');
      const rawSearch = searchInput ? searchInput.value.trim() : '';
      const list = document.getElementById('policyList');
      if (!list) return;
      list.innerHTML = '';

      const filtered = allPolicies.filter(p => {
        if (rawSearch && !isMatch(p.petName, rawSearch) && !isMatch(p.code, rawSearch)) {
          return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">조회된 단가 정보가 없습니다.</div>`;
        return;
      }

      let htmlBuffer = '';
      filtered.forEach(p => {
        const typeData = p[currentType];
        const subAmount = (currentType === '기변') ? p.subChange : p.sub010;
        const targetValue = (currentType === '기변') ? p.targetChange : p.target010MNP;
        
        let chujiBadge = '';
        if (p.addPolicyVal && p.addPolicyVal !== 'None' && p.addPolicyVal !== '' &&
            targetValue && targetValue !== 'None' && targetValue !== '') {
          chujiBadge = `
            <div class="mt-1.5 text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-semibold block text-center leading-tight">
              추지원금 ${targetValue} 설정 시<br><span class="text-blue-800 font-bold">+${p.addPolicyVal}만</span>
            </div>
          `;
        }

        htmlBuffer += `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-start border-b pb-2 border-slate-100">
              <div>
                <span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${p.petName}</span>
                <h3 class="font-bold text-slate-800 text-base mt-0.5">${p.code}</h3>
                <div class="text-xs text-slate-400">출고가: ${p.price.toLocaleString()}원</div>
              </div>
              <div class="text-right">
                <span class="text-[10px] bg-red-100 text-red-600 font-bold px-1.5 py-0.5 rounded">${currentType} 기준</span>
                <div class="text-xs text-slate-500 mt-1">공통지원금 (베스트109 기준): <span class="font-bold text-slate-700">${subAmount.toLocaleString()}원</span></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-center">
              <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-[11px] text-slate-500 font-medium">공통 인센티브</div>
                <div class="text-lg font-extrabold text-red-600">${typeData.common} <span class="text-xs">만원</span></div>
              </div>
              <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 flex flex-col justify-center items-center">
                <div class="text-[11px] text-slate-500 font-medium">선약 인센티브</div>
                <div class="text-lg font-extrabold text-blue-600">${typeData.select} <span class="text-xs">만원</span></div>
                ${chujiBadge}
              </div>
            </div>

            <div class="text-[11px] text-slate-400 text-right">
              기준요금제: <span class="font-semibold text-slate-600">${typeData.plan}</span>
            </div>
          </div>
        `;
      });
      list.innerHTML = htmlBuffer;
    }

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-red-600', 'shadow-sm');
        btn.classList.add('text-slate-500');
      });
      const activeBtn = document.getElementById(`tab-${type}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-red-600', 'shadow-sm');
        activeBtn.classList.remove('text-slate-500');
      }

      renderPolicies();
    }

    window.onload = function() {
      fetchPolicyData();
    };
  </script>
</body>
</html>
